---
services:
  grafana-mcp:
    image: grafana/mcp-grafana:1.3.0
    entrypoint: ["/app/mcp-grafana"]
    command:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --allowed-hosts=localhost:20131,127.0.0.1:20131
      - --disable-write=true
    env_file:
      - .env
    ports:
      - "127.0.0.1:20131:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
