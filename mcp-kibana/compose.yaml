---
name: mcp-kibana

services:
  mcp-kibana:
    image: mcp-server-kibana:0.11.1
    build:
      context: .
      dockerfile_inline: |
        FROM node:25-slim
        RUN npm install -g --no-fund --no-audit @tocharianou/mcp-server-kibana@0.11.1 \
            && npm cache clean --force
        USER node
        EXPOSE 8000
        ENTRYPOINT ["mcp-server-kibana"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1
    env_file:
      - .env
    ports:
      - "127.0.0.1:20132:8000"
    restart: unless-stopped
    pull_policy: build
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true