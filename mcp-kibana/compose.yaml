---
services:
  mcp-kibana:
    build:
      context: .
    image: mcp-server-kibana:0.11.1
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:20132:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
