---
name: mcp-kibana

services:
  mcp-kibana:
    image: mcp-server-kibana:0.11.1
    build:
      context: .
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8000
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1
    env_file:
      - .env
    ports:
      - '127.0.0.1:20132:8000'
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
