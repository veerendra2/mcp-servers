---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker-compose"
    # New servers must be added here. mcp-kibana is excluded: its image is
    # built locally, so Dependabot's tag lookup fails and fails the whole job.
    directories:
      - "/mcp-atlassian"
      - "/mcp-elasticsearch"
      - "/mcp-grafana"
    schedule:
      interval: "monthly"
    groups:
      docker-compose:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/mcp-kibana"
    schedule:
      interval: "monthly"
