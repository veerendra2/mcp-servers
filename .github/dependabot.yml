---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker-compose"
    # Only elasticsearch pins an image tag. atlassian and grafana track
    # `:latest`, which Dependabot cannot bump, and mcp-kibana builds locally,
    # which makes its Docker Hub tag lookup fail the whole job.
    directories:
      - "/mcp-elasticsearch"
    schedule:
      interval: "monthly"
    groups:
      docker-compose:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/mcp-kibana"
    schedule:
      interval: "monthly"
