---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker-compose"
    directories:
      - "/mcp-*"
    schedule:
      interval: "monthly"
    groups:
      docker-compose:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/mcp-kibana"
    schedule:
      interval: "monthly"
