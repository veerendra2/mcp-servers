---
name: mcp-elasticsearch
services:
  mcp-elasticsearch:
    image: ghcr.io/cr7258/elasticsearch-mcp-server:v2.1.9
    environment:
      DISABLE_HIGH_RISK_OPERATIONS: "true"
      VERIFY_CERTS: "false"
    env_file:
      - .env
    ports:
      - '127.0.0.1:20130:8000'
    restart: unless-stopped
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
