---
services:
  mcp-elasticsearch:
    # TODO: Switch to ghcr.io/cr7258/elasticsearch-mcp-server:latest once the
    # PR is merged: https://github.com/cr7258/elasticsearch-mcp-server/pull/76
    image: veerendra2/elasticsearch-mcp-server:latest
    env_file:
      - .env
    environment:
      DISABLE_HIGH_RISK_OPERATIONS: "true"
      VERIFY_CERTS: "false"
    ports:
      - "127.0.0.1:20130:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
